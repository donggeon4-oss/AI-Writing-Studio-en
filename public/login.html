<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Writing Studio – Access</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display:flex;justify-content:center;align-items:center;
      height:100vh;
      background:linear-gradient(135deg,#ffe8ef,#ffd6c5,#ffc59c,#ffe3b1);
      font-family:'Pretendard',sans-serif;
    }
    .login-box {
      width:340px;padding:34px;
      background:rgba(255,240,230,0.85);
      border-radius:20px;
      border:1px solid rgba(255,200,180,0.8);
      box-shadow:0 12px 32px rgba(255,150,120,0.35);
      text-align:center;
    }
    input {
      width:100%;padding:14px;margin-top:16px;
      border-radius:14px;border:1px solid rgba(255,200,180,0.9);
    }
    button {
      margin-top:20px;width:100%;padding:14px;
      border-radius:16px;border:none;cursor:pointer;
      background:linear-gradient(135deg,#ff9771,#ff6f61,#ff4f5e);
      color:white;font-weight:600;
    }
    #msg {margin-top:12px;font-size:14px;color:#8a4b3a;}
  </style>
</head>
<body>

<div class="login-box">
  <h2>🔐 Enter License Key</h2>
  <input id="licenseKey" placeholder="XXXX-XXXX-XXXX-XXXX">
  <button onclick="verifyKey()">Verify</button>
  <div id="msg"></div>
</div>

<script>
async function verifyKey() {
  const key = document.getElementById("licenseKey").value.trim();
  document.getElementById("msg").innerText = "Verifying...";

  const res = await fetch("/verify-license", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ key })
  });

  const data = await res.json();

  if (data.valid) {
    localStorage.setItem("ai_license", key);
    window.location.href = "/workspace.html";
  } else {
    document.getElementById("msg").innerText = "❌ Invalid or expired key.";
  }
}
</script>

</body>
</html>
